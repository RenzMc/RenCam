# =============================================================================
# RenCam — Build APK (GitHub Actions)
# Author: RenzMc
# =============================================================================

name: Build RenCam APK

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble RenCam APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ANDROID_COMPILE_SDK: "33"
      ANDROID_BUILD_TOOLS: "30.0.3"

      KEYSTORE_BASE64: ${{ secrets.RENCAM_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.RENCAM_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.RENCAM_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.RENCAM_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install legacy Android build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libncurses5

          echo "Checking ncurses dependency..."
          ldconfig -p | grep -E 'libncurses.so.5|libtinfo.so.5' || true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required SDK packages
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "build-tools;33.0.2"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Verify RenderScript compiler
        run: |
          set -euo pipefail

          LLVM_RS="$ANDROID_SDK_ROOT/build-tools/30.0.3/llvm-rs-cc"

          if [ ! -x "$LLVM_RS" ]; then
            echo "::error::llvm-rs-cc was not found at $LLVM_RS"
            exit 1
          fi

          echo "RenderScript compiler:"
          "$LLVM_RS" --version || true

          echo "Checking shared libraries:"
          ldd "$LLVM_RS" | grep -E 'ncurses|tinfo|not found' || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign release APK
        run: |
          set -euo pipefail

          RELEASE_DIR="app/build/outputs/apk/release"

          APK=$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.apk' \
            ! -name '*-unsigned.apk' \
            ! -name '*-unaligned.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.apk' | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi

          echo "Release APK: $APK"

          KS_PASS="${KEYSTORE_PASSWORD:-rencam123}"
          K_ALIAS="${KEY_ALIAS:-rencam}"
          K_PASS="${KEY_PASSWORD:-$KS_PASS}"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Using repository keystore."
            echo "$KEYSTORE_BASE64" | base64 --decode > rencam-release.keystore
          else
            echo "Generating temporary CI keystore."

            keytool -genkeypair \
              -v \
              -keystore rencam-release.keystore \
              -storepass "$KS_PASS" \
              -alias "$K_ALIAS" \
              -keypass "$K_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=RenCam, OU=RenzMc, O=RenzMc, L=Jakarta, C=ID"
          fi

          BUILD_TOOLS_DIR="$ANDROID_SDK_ROOT/build-tools/33.0.2"

          if [ ! -x "$BUILD_TOOLS_DIR/zipalign" ]; then
            echo "::error::zipalign not found."
            exit 1
          fi

          if [ ! -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            echo "::error::apksigner not found."
            exit 1
          fi

          "$BUILD_TOOLS_DIR/zipalign" \
            -p \
            -f \
            4 \
            "$APK" \
            app-release-aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks rencam-release.keystore \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$K_ALIAS" \
            --key-pass "pass:$K_PASS" \
            --out app-release-signed.apk \
            app-release-aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" verify \
            --verbose \
            app-release-signed.apk

      - name: Prepare release APK
        run: |
          set -euo pipefail

          mkdir -p release

          if [ ! -f app-release-signed.apk ]; then
            echo "::error::Signed APK not found."
            exit 1
          fi

          cp app-release-signed.apk \
            release/RenCam-release-signed.apk

          echo "===== Release APK ====="
          ls -lh release/RenCam-release-signed.apk
          echo "======================="

      - name: Create GitHub Release
        if: ${{ github.event_name != 'pull_request' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rencam-build-${{ github.run_number }}
          name: RenCam Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release/RenCam-release-signed.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Job summary
        if: always()
        run: |
          {
            echo "## RenCam APK build"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Ref | \`${GITHUB_REF}\` |"
            echo "| Runner | Ubuntu 22.04 |"
            echo "| JDK | 17 (Temurin) |"
            echo "| Compile SDK | ${ANDROID_COMPILE_SDK} |"
            echo "| RenderScript Build Tools | ${ANDROID_BUILD_TOOLS} |"
            echo ""
            echo "### Produced APK"
            echo '```'
            ls -lh release 2>/dev/null || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
